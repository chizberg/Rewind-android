name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # One job per check, so the merge box names what broke instead of a single "build" that could be
  # anything from a stray space to a failing test. A matrix rather than four copy-pasted jobs: the
  # setup is identical and only the Gradle invocation differs. `fail-fast: false` matters — a red
  # formatter must not cancel the tests, otherwise the next push fixes the formatting and only then
  # discovers the test failure.
  #
  # The price of the split is that each job gets its own runner and compiles the sources again;
  # Gradle's cache softens it, but the wall clock is longer than one job doing everything.
  #
  # Job names double as the required status check contexts in the `main CI and history` ruleset —
  # renaming one here silently drops its gate until the ruleset is updated too.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            tasks: spotlessCheck detekt
          - name: test
            tasks: testDebugUnitTest
          - name: lint
            tasks: lint
          # assembleRelease, not assembleDebug: it is the variant that ships, and AGP hangs
          # lintVitalRelease off it, so the fatal-severity checks come along. Once M16 turns R8 on,
          # a missing keep rule starts failing here without touching this file.
          - name: build
            tasks: assembleRelease
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew ${{ matrix.tasks }}
        run: ./gradlew ${{ matrix.tasks }} --stacktrace
