name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (Spotless/ktlint) and static analysis (detekt)
        run: ./gradlew spotlessCheck detekt --stacktrace

      - name: Run unit tests and Android lint
        run: ./gradlew testDebugUnitTest lint --stacktrace
